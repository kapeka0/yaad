name: yaad

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-external-tool-env: &external-tool-env
  EXTERNAL_TOOL_KILL_GRACE_MS: ${EXTERNAL_TOOL_KILL_GRACE_MS:-5000}
  EXTERNAL_TOOL_STDERR_MAX_BYTES: ${EXTERNAL_TOOL_STDERR_MAX_BYTES:-65536}

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: yaad
      POSTGRES_PASSWORD: yaad
      POSTGRES_DB: yaad
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaad"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-yaad}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-yaadyaad}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  cultivate-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.cultivate
    restart: unless-stopped
    logging: *default-logging
    init: true
    pids_limit: 512
    shm_size: '256m'
    environment:
      PORT: 3000
      CULTIVATE_MAX_CONCURRENCY: 1
      CULTIVATE_ANALYSIS_TIMEOUT_MS: 50000
      CULTIVATE_CLEANUP_TIMEOUT_MS: 5000
      CULTIVATE_PID_RECYCLE_THRESHOLD: 384
      CULTIVATE_FAILURE_RECYCLE_THRESHOLD: 3
      CULTIVATE_WATCHDOG_INTERVAL_MS: 10000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    stop_grace_period: 10s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://yaad:yaad@postgres:5432/yaad
      REDIS_URL: redis://redis:6379
      PORT: 3000
      LOG_LEVEL: info
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-yaad}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-yaadyaad}
      S3_BUCKET: ${S3_BUCKET:-js-blobs}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  scope-importer:
    build:
      context: .
      dockerfile: services/scope-importer/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://yaad:yaad@postgres:5432/yaad
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      # PDCP_API_KEY: your_key_here
    depends_on:
      api:
        condition: service_healthy

  subdomain-worker:
    build:
      context: .
      dockerfile: services/subdomain-worker/Dockerfile
    restart: unless-stopped
    stop_grace_period: 70s
    logging: *default-logging
    environment:
      <<: *external-tool-env
      DATABASE_URL: postgresql://yaad:yaad@postgres:5432/yaad
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${SUBDOMAIN_WORKER_CONCURRENCY:-${WORKER_CONCURRENCY:-5}}
      LOG_LEVEL: info
      # Extra passive sources (crt.sh + gau); set to "false" to disable
      CRTSH_ENABLED: ${CRTSH_ENABLED:-true}
      GAU_ENABLED: ${GAU_ENABLED:-true}
      SUBFINDER_DEEP: ${SUBFINDER_DEEP:-true}
      SUBFINDER_TIMEOUT_MS: ${SUBFINDER_TIMEOUT_MS:-900000}
      CRTSH_TIMEOUT_MS: ${CRTSH_TIMEOUT_MS:-30000}
      GAU_TIMEOUT_MS: ${GAU_TIMEOUT_MS:-600000}
      DNSX_TIMEOUT_MS: ${DNSX_TIMEOUT_MS:-600000}
      PDCP_TIMEOUT_MS: ${PDCP_TIMEOUT_MS:-60000}
      PDCP_API_KEY: ${PDCP_API_KEY:-}
      MAX_RECURSION_DEPTH: ${MAX_RECURSION_DEPTH:-2}
    depends_on:
      api:
        condition: service_healthy

  httpx-worker:
    build:
      context: .
      dockerfile: services/httpx-worker/Dockerfile
    restart: unless-stopped
    stop_grace_period: 70s
    logging: *default-logging
    environment:
      <<: *external-tool-env
      DATABASE_URL: postgresql://yaad:yaad@postgres:5432/yaad
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${HTTPX_WORKER_CONCURRENCY:-${WORKER_CONCURRENCY:-5}}
      LOG_LEVEL: info
      HTTPX_TIMEOUT_MS: ${HTTPX_TIMEOUT_MS:-120000}
    depends_on:
      api:
        condition: service_healthy

  js-worker:
    build:
      context: .
      dockerfile: services/js-worker/Dockerfile
    restart: unless-stopped
    stop_grace_period: 70s
    logging: *default-logging
    environment:
      <<: *external-tool-env
      DATABASE_URL: postgresql://yaad:yaad@postgres:5432/yaad
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${JS_WORKER_CONCURRENCY:-${WORKER_CONCURRENCY:-5}}
      LOG_LEVEL: info
      # JS blob storage (MinIO, content-addressable + zstd + dedup)
      STORE_JS_BLOBS: ${STORE_JS_BLOBS:-true}
      DETECT_JS_LIBRARIES: ${DETECT_JS_LIBRARIES:-true}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-yaad}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-yaadyaad}
      S3_BUCKET: ${S3_BUCKET:-js-blobs}
      JS_MAX_BYTES: ${JS_MAX_BYTES:-10485760}
      GETJS_TIMEOUT_MS: ${GETJS_TIMEOUT_MS:-120000}
      RETIRE_TIMEOUT_MS: ${RETIRE_TIMEOUT_MS:-300000}
      # Recursion budget for JS-discovered subdomains
      MAX_RECURSION_DEPTH: ${MAX_RECURSION_DEPTH:-2}
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy

  endpoint-worker:
    build:
      context: .
      dockerfile: services/endpoint-worker/Dockerfile
    restart: unless-stopped
    stop_grace_period: 70s
    logging: *default-logging
    environment:
      <<: *external-tool-env
      DATABASE_URL: postgresql://yaad:yaad@postgres:5432/yaad
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${ENDPOINT_WORKER_CONCURRENCY:-${WORKER_CONCURRENCY:-5}}
      LOG_LEVEL: info
      LINKFINDER_TIMEOUT_MS: ${LINKFINDER_TIMEOUT_MS:-300000}
      SCHEDULER_MAX_SCAN_QUEUE: ${SCHEDULER_MAX_SCAN_QUEUE:-10000}
      SCHEDULER_MAX_TECH_QUEUE: ${SCHEDULER_MAX_TECH_QUEUE:-5000}
    depends_on:
      api:
        condition: service_healthy

  tech-worker:
    build:
      context: .
      dockerfile: services/tech-worker/Dockerfile
    restart: unless-stopped
    stop_grace_period: 70s
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://yaad:yaad@postgres:5432/yaad
      REDIS_URL: redis://redis:6379
      CULTIVATE_API_URL: http://cultivate-api:3000
      # Cultivate owns one local Chromium at a time so forced cleanup never
      # races another analysis.
      TECH_WORKER_CONCURRENCY: 1
      CONFIDENCE_THRESHOLD: 50
      LOG_LEVEL: info
    depends_on:
      api:
        condition: service_healthy
      cultivate-api:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    restart: unless-stopped
    stop_grace_period: 70s
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://yaad:yaad@postgres:5432/yaad
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      # How often (ms) to look for stale rows to refresh
      SCHEDULER_TICK_MS: ${SCHEDULER_TICK_MS:-900000}
      # Max rows re-enqueued per stage per tick
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-500}
      SCHEDULER_RETRY_INTERVAL_HOURS: ${SCHEDULER_RETRY_INTERVAL_HOURS:-6}
      SCHEDULER_MAX_ENUM_QUEUE: ${SCHEDULER_MAX_ENUM_QUEUE:-10000}
      SCHEDULER_MAX_SCAN_QUEUE: ${SCHEDULER_MAX_SCAN_QUEUE:-10000}
      SCHEDULER_MAX_COLLECT_QUEUE: ${SCHEDULER_MAX_COLLECT_QUEUE:-5000}
      SCHEDULER_MAX_ANALYZE_QUEUE: ${SCHEDULER_MAX_ANALYZE_QUEUE:-20000}
      SCHEDULER_MAX_TECH_QUEUE: ${SCHEDULER_MAX_TECH_QUEUE:-5000}
      # Re-enumerate a wildcard scope's subdomains after this many hours (7d)
      RESCAN_ENUM_INTERVAL_HOURS: ${RESCAN_ENUM_INTERVAL_HOURS:-168}
      # Re-scan a known asset (httpx→js→tech) after this many hours (1d)
      RESCAN_HTTP_INTERVAL_HOURS: ${RESCAN_HTTP_INTERVAL_HOURS:-24}
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://yaad:yaad@postgres:5432/yaad
      REDIS_URL: redis://redis:6379
      # Backend API (used to proxy /js/grep, which needs MinIO access)
      API_URL: http://api:3000
      NEXT_PUBLIC_ICON_BASE_URL: ${ICON_BASE_URL:-https://zrqvcicitadfkaaklgmg.supabase.co/storage/v1/object/public/tech-icons/}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
