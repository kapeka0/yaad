name: yaad

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: yaad
      POSTGRES_PASSWORD: yaad
      POSTGRES_DB: yaad
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaad"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  cultivate-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.cultivate
    shm_size: '256m'
    environment:
      PORT: 3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://yaad:yaad@postgres:5432/yaad
      REDIS_URL: redis://redis:6379
      PORT: 3000
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  scope-importer:
    build:
      context: .
      dockerfile: services/scope-importer/Dockerfile
    environment:
      DATABASE_URL: postgresql://yaad:yaad@postgres:5432/yaad
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      # PDCP_API_KEY: your_key_here
    depends_on:
      api:
        condition: service_healthy

  subdomain-worker:
    build:
      context: .
      dockerfile: services/subdomain-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://yaad:yaad@postgres:5432/yaad
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 5
      LOG_LEVEL: info
      # PDCP_API_KEY: your_key_here
    depends_on:
      api:
        condition: service_healthy

  httpx-worker:
    build:
      context: .
      dockerfile: services/httpx-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://yaad:yaad@postgres:5432/yaad
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 5
      LOG_LEVEL: info
    depends_on:
      api:
        condition: service_healthy

  js-worker:
    build:
      context: .
      dockerfile: services/js-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://yaad:yaad@postgres:5432/yaad
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 5
      LOG_LEVEL: info
    depends_on:
      api:
        condition: service_healthy

  endpoint-worker:
    build:
      context: .
      dockerfile: services/endpoint-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://yaad:yaad@postgres:5432/yaad
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 5
      LOG_LEVEL: info
    depends_on:
      api:
        condition: service_healthy

  tech-worker:
    build:
      context: .
      dockerfile: services/tech-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://yaad:yaad@postgres:5432/yaad
      REDIS_URL: redis://redis:6379
      CULTIVATE_API_URL: http://cultivate-api:3000
      TECH_WORKER_CONCURRENCY: 3
      CONFIDENCE_THRESHOLD: 50
      LOG_LEVEL: info
    depends_on:
      api:
        condition: service_healthy
      cultivate-api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://yaad:yaad@postgres:5432/yaad
      NEXT_PUBLIC_ICON_BASE_URL: ${ICON_BASE_URL:-https://zrqvcicitadfkaaklgmg.supabase.co/storage/v1/object/public/tech-icons/}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
